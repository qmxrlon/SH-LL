name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq

      - name: ShellCheck
        run: shellcheck linux/sh-ll.sh

      - name: Tests
        run: bats tests/sh-ll.bats

      - name: Run against the runner
        run: |
          set +e
          ./linux/sh-ll.sh
          ./linux/sh-ll.sh --format json > report.json
          code=$?
          set -e
          echo "exit code: $code"
          jq -e '.host.platform == "linux" and (.disks | length) > 0 and .memory.total_mb > 0' report.json
          [ "$code" -le 3 ]

  windows:
    name: Windows (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path windows, tests -Recurse
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Tests (PowerShell 7)
        shell: pwsh
        run: ./tests/sh-ll.Tests.ps1

      - name: Tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\sh-ll.Tests.ps1

      - name: Run against the runner
        shell: pwsh
        run: |
          ./windows/sh-ll.ps1
          "exit code: $LASTEXITCODE"
          exit 0
